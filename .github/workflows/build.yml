name: Build Windows app

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    # The repo name ends in "." which Windows can't use as a folder name,
    # so work in the temp folder instead of the normal checkout folder.
    steps:
      - name: Get the code
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GH_TOKEN"))
          git -c "http.extraheader=AUTHORIZATION: basic $auth" clone --depth 1 --branch "$env:GITHUB_REF_NAME" "https://github.com/$env:GITHUB_REPOSITORY.git" src
          Copy-Item src\MacKeyboard.ahk .

      - name: Download AutoHotkey v2 and Ahk2Exe
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $h = @{ Authorization = "Bearer $env:GH_TOKEN" }
          foreach ($repo in 'AutoHotkey/AutoHotkey', 'AutoHotkey/Ahk2Exe') {
            $rel = Invoke-RestMethod "https://api.github.com/repos/$repo/releases/latest" -Headers $h
            $zip = $rel.assets | Where-Object name -like '*.zip' | Select-Object -First 1
            $name = $repo.Split('/')[1]
            Invoke-WebRequest $zip.browser_download_url -OutFile "$name.zip"
            Expand-Archive "$name.zip" -DestinationPath "tools\$name"
          }
          Get-ChildItem tools -Recurse -Filter *.exe | Select-Object FullName

      - name: Compile MacKeyboard.exe
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ahk2exe = (Get-ChildItem tools\Ahk2Exe -Recurse -Filter Ahk2Exe.exe | Select-Object -First 1).FullName
          $base = (Get-ChildItem tools\AutoHotkey -Recurse -Filter AutoHotkey64.exe | Select-Object -First 1).FullName
          New-Item -ItemType Directory -Force dist | Out-Null
          $p = Start-Process $ahk2exe -ArgumentList @('/in', 'MacKeyboard.ahk', '/out', 'dist\MacKeyboard.exe', '/base', "`"$base`"", '/silent', 'verbose') -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0 -or -not (Test-Path dist\MacKeyboard.exe)) { throw "Ahk2Exe failed ($($p.ExitCode))" }
          Get-Item dist\MacKeyboard.exe

      - uses: actions/upload-artifact@v4
        with:
          name: MacKeyboard
          path: ${{ runner.temp }}/dist/MacKeyboard.exe

      - name: Read version
        id: ver
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          $v = (Select-String -Path MacKeyboard.ahk -Pattern 'VERSION := "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      # Every change to the main branch posts the .exe on the Releases page
      - name: Publish release
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Mac Keyboard v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: Download **MacKeyboard.exe** below, put it somewhere permanent (like Documents) and double-click it. No AutoHotkey needed.
          files: ${{ runner.temp }}/dist/MacKeyboard.exe
